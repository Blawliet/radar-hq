# =====================================================================
# LOJAS MONITORADAS
# =====================================================================
# adaptador:
#   auto          detecta a plataforma (VTEX, Shopify, Nuvemshop, Woo, Tray, Magento...)
#   amazon        coletor próprio
#   mercadolivre  API oficial de catálogo (precisa de ML_CLIENT_ID e ML_CLIENT_SECRET)
#   magento       API GraphQL da loja (Panini, Pipoca & Nanquim, Comix, Comic Boom)
#   vtex          API de catálogo da VTEX (Livrarias Curitiba; Rika e Ri Happy são detectadas)
#   woocommerce   Store API do WordPress (Monstra, Capitão Onigiri, Amora, Comix Zone)
#   shopify       API pública da Shopify (Taverna do Rei)
#   nuvemshop     busca da loja + estoque das variantes na página (Mirane Comics)
#   html          busca HTML genérica (use "busca" e "padrao_produto")
# categorias:     o que buscar nesta loja: [livros] (padrão), [games] ou [livros, games]
# oficial: true   loja da editora; preço cheio dela vira referência de "preço de capa"
# playwright: true  abre num navegador real (lojas com muito JavaScript)
# delay:          pausa entre acessos à mesma loja, em segundos (padrão 3; APIs aguentam 1,5)
# validar_sem_navegador: true  confere a página do produto sem navegador quando possível
# tempo_max_min:  minutos máximos para a loja em cada varredura (padrão 15)
#
# Para conferir se cada loja responde:  python verificar_lojas.py
# =====================================================================

lojas:
  - nome: Loja Panini
    delay: 1.5
    adaptador: magento
    base: https://panini.com.br
    oficial: true

  - nome: Pipoca & Nanquim
    delay: 1.5
    adaptador: magento
    base: https://pipocaenanquim.com.br
    sufixo_url: ".html"
    oficial: true

  - nome: Amazon Brasil
    adaptador: amazon
    max_resultados: 8
    tempo_max_min: 8        # a mais lenta; bloqueia boa parte das páginas

  # API oficial de catálogo. Precisa dos Secrets ML_CLIENT_ID e ML_CLIENT_SECRET
  # (app grátis no portal de desenvolvedores); sem eles a loja é pulada sozinha.
  - nome: Mercado Livre
    adaptador: mercadolivre
    produtos_por_busca: 6
    tempo_max_min: 8

  # desativado: bloqueia acessos vindos da nuvem (nenhum resultado em todas as varreduras)
  - nome: Magalu
    ativo: false
    adaptador: html
    base: https://www.magazineluiza.com.br
    busca: "/busca/{q_path}/"
    padrao_produto: "/p/[0-9a-z]+/?"
    playwright: true

  - nome: Ri Happy
    delay: 1.5
    adaptador: auto
    base: https://www.rihappy.com.br

  - nome: Estante Virtual
    adaptador: html
    base: https://www.estantevirtual.com.br
    busca: "/busca?q={q}"
    padrao_produto: "/livros?/"
    playwright: true
    max_resultados: 8

  - nome: Rika Comic Shop
    delay: 1.5
    adaptador: auto
    base: https://www.rika.com.br

  - nome: Comix Book Shop
    delay: 1.5
    adaptador: magento
    base: https://www.comix.com.br
    sufixo_url: ".html"

  - nome: Monstra
    delay: 1.5
    adaptador: woocommerce
    base: https://lojamonstra.com.br
    oficial: true        # loja da editora Monstra (Fantasma, Dylan Dog...)

  - nome: Comix Zone
    delay: 1.5
    adaptador: woocommerce
    base: https://comixzone.com.br
    oficial: true        # loja da editora Comix Zone (As Guerras de Lucas, Nossos Melhores Amigos...)

  - nome: Comic Boom
    delay: 1.5
    adaptador: magento
    base: https://comicboom.com.br
    sufixo_url: ""

  - nome: Capitão Onigiri
    delay: 1.5
    adaptador: woocommerce
    base: https://www.capitaoonigiri.com.br

  - nome: Amora Bookstore
    delay: 1.5
    adaptador: woocommerce
    base: https://amorabookstore.com.br

  - nome: Taverna do Rei
    delay: 1.5
    adaptador: shopify
    base: https://tavernadorei.com.br

  - nome: Mundos Infinitos
    adaptador: html
    base: https://mundosinfinitos.com.br
    busca: "/geek/solucoes/busca.aspx?t={q}"
    padrao_produto: "/geek/produto/"

  - nome: Livrarias Curitiba
    delay: 1.5
    adaptador: vtex
    base: https://www.livrariascuritiba.com.br

  # plataforma não identificada daqui: o radar detecta sozinho na primeira execução
  # (o resultado fica em data/plataformas.json)
  - nome: Leitura
    adaptador: auto
    base: https://leitura.com.br

  - nome: Mirane Comics
    delay: 1.5
    adaptador: nuvemshop
    base: https://miranecomics.com.br

  - nome: KaBuM!
    adaptador: html
    base: https://www.kabum.com.br
    busca: "/busca/{q_slug}"
    padrao_produto: "/produto/\\d+"
    playwright: true
    seletor_espera: "#blocoValores"
    categorias: [games]
    # o botão "Comprar" da KaBuM! nasce desativado até a página carregar inteira;
    # "Restam N unid." confirma o estoque e o preço válido é o do PIX
    estoque_ok_regex: 'restam\s+\d+\s+unid'
    preco_regex: 'r\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})[^$]{0,40}?vista no pix'

  # Shopee: desativada. A busca exige login e tem antirrobô agressivo; um
  # coletor estável violaria os termos de uso. Ofertas da Shopee costumam
  # aparecer em grupos de promoção, que o webhook do WhatsApp já escuta.
  - nome: Shopee
    adaptador: html
    base: https://shopee.com.br
    ativo: false
