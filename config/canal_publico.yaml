# =====================================================================
# CANAL PÚBLICO "NESTA ESTANTE" (Canal do WhatsApp)
# =====================================================================
# O radar manda os posts prontos para o Bruno numa conversa privada com o bot do
# Telegram; ele copia e cola no Canal do WhatsApp. O grupo BASTA LER não muda.
#
# Para onde vão os rascunhos: o Bruno abre o link do bot com o código de pareamento
# (/start nesta-...) e o radar salva a conversa sozinho, cifrada com o token do bot.
# Aqui fica só o hash do código. Opcional: Secret NESTA_RASCUNHO_CHAT com o ID direto.
# Tag de Associado da Amazon: Secret AMAZON_TAG (quando existir).
# =====================================================================
ativo: true
codigo_hash: fc3c9e9c4fe18945ada202ab86dae62a1ee1915c2facfa5d8aa8f344efcb2cf3
desconto_minimo: 30        # % de desconto para virar post
# começo devagar: 3 posts por dia, cada um a melhor oferta das últimas 8 horas
horarios_post: ["09:30", "13:30", "19:30"]
posts_por_horario: 1
janela_horas: 8
repostar_dias: 7           # o mesmo produto só volta se o preço cair de novo

# buscas próprias do canal na Amazon (3 por rodada, revezando), além das buscas das listas
buscas_por_rodada: 3
buscas:
  - manga panini
  - manga jbc
  - manga newpop
  - hq panini capa dura
  - omnibus marvel
  - omnibus dc
  - graphic novel
  - box manga
  - pipoca e nanquim
  - hq dc comics
  - manga devir
  - quadrinhos nacionais
