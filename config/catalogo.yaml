# =====================================================================
# CATÁLOGO DO RADAR HQ
# =====================================================================
# Como cada entrada casa com um anúncio:
#   termos:        TODAS essas palavras precisam estar no título (sem acento, minúsculas)
#   qualquer:      pelo menos UMA dessas precisa estar no título
#   excluir:       NENHUMA dessas pode estar no título
#   regex / excluir_regex: para casos chatos (opcionais)
#   volumes:       "8,14" | "3-4" | "12+" | "todos" | "box" (item sem número de volume)
#   buscas:        o que digitar na busca de cada loja
#
# Precedência: Regra C (bloqueio) > Regra A (raro) > Regra B (promo) > Radar Omnibus.
# Se um anúncio casa com uma série do catálogo mas o volume NÃO está na lista,
# ele é ignorado (não cai no Radar Omnibus). Ex.: Battle Royale Omnibus vol. 6.
# =====================================================================

config:
  desconto_minimo: 25        # % mínimo da Regra B
  margem_preco_lista: 1.05   # preço "de" acima da capa x 1.05 é tratado como inflado

# ---------------------------------------------------------------------
# REGRA C: BLOQUEIOS (já tenho, NUNCA alertar)
# ---------------------------------------------------------------------
bloqueios:
  - id: battle-royale-2-5
    termos: [battle royale]
    volumes: "2,5"
  - id: demon-slayer
    qualquer: [demon slayer, kimetsu no yaiba]
    volumes: todos
  - id: zero-hora
    termos: [zero hora]
    volumes: todos
  - id: invencivel-1-2
    termos: [invencivel]
    volumes: "1-2"
  - id: spawn-mensal-1-8
    termos: [spawn]
    excluir: [origens, omnibus, rei, cogliostro, sam, twitch, medieval, compendio]
    volumes: "1-8"
  - id: spawn-origens-1-9-11
    termos: [spawn, origens]
    volumes: "1-9,11"
  - id: box-gantz-parte-1
    termos: [gantz]
    qualquer: [box, caixa, colecao]
    excluir_regex: 'parte\s*2|caixa\s*2|19\s*(a|ao|-|ate)\s*37'
    volumes: box

# ---------------------------------------------------------------------
# REGRA A: RAROS (alerta em QUALQUER valor, com estoque real)
# ---------------------------------------------------------------------
raros:
  - id: saga-do-flash
    nome: A Saga do Flash
    editora: Panini
    termos: [saga do flash]
    volumes: "8,14"
    prioridade: maxima
    formato: Encadernado
    buscas: [a saga do flash]

  - id: quarteto-hickman
    nome: Quarteto Fantástico por Jonathan Hickman
    editora: Panini
    termos: [quarteto fantastico, hickman]
    volumes: "2"
    formato: Omnibus
    buscas: [quarteto fantastico hickman omnibus]

  - id: one-piece
    nome: One Piece
    editora: Panini
    termos: [one piece]
    excluir: [3 em 1, 3 in 1, novel, film, databook, color walk, guia, blue, yellow, red, green]
    volumes: "97,98,103,104"
    formato: Mangá
    buscas: [one piece vol 97, one piece vol 98, one piece vol 103, one piece vol 104]

  - id: blueberry-definitiva
    nome: "Blueberry: Edição Definitiva"
    editora: Pipoca & Nanquim
    termos: [blueberry]
    volumes: "3,4"
    formato: Capa Dura
    buscas: [blueberry edicao definitiva]

  - id: supergirl-peter-david
    nome: Supergirl por Peter David e Gary Frank
    editora: Panini
    termos: [supergirl]
    qualquer: [peter david, gary frank]
    volumes: "4,5"
    formato: Encadernado
    buscas: [supergirl peter david]

  - id: spawn-origens
    nome: Spawn Origens
    editora: Panini
    termos: [spawn, origens]
    volumes: "10,12+"
    formato: Encadernado
    buscas: [spawn origens]

  - id: spawn-mensal
    nome: Spawn (mensal)
    editora: Panini
    termos: [spawn]
    excluir: [origens, omnibus, rei, cogliostro, sam, twitch, medieval, compendio]
    volumes: "9+"
    formato: Encadernado
    buscas: [spawn panini]

  - id: saga-lanterna-verde
    nome: A Saga do Lanterna Verde
    editora: Panini
    termos: [saga do lanterna verde]
    volumes: "3+"
    formato: Encadernado
    buscas: [a saga do lanterna verde]

  - id: absolute-batman
    nome: Absolute Batman
    editora: Panini
    termos: [absolute batman]
    volumes: "2"
    formato: Encadernado
    buscas: [absolute batman]

# ---------------------------------------------------------------------
# REGRA B: PROMOÇÕES (só com desconto real >= desconto_minimo)
# ---------------------------------------------------------------------
promocoes:
  - id: flash-geoff-johns
    nome: Flash por Geoff Johns
    editora: Panini
    termos: [flash, geoff johns]
    volumes: "2,3"
    formato: Omnibus
    buscas: [flash geoff johns omnibus]

  - id: box-ajin
    nome: Box Ajin (vols. 1 ao 17)
    editora: Panini
    termos: [ajin]
    qualquer: [box, caixa, colecao completa]
    volumes: box
    formato: Mangá
    buscas: [box ajin]

  - id: box-gantz-parte-2
    nome: Box Gantz Parte 2 (vols. 19 ao 37)
    editora: Panini
    termos: [gantz]
    regex: 'parte\s*2|caixa\s*2|19\s*(a|ao|-|ate)\s*37'
    volumes: box
    formato: Mangá
    buscas: [box gantz parte 2]

  - id: battle-royale-omnibus
    nome: Battle Royale Omnibus
    editora: Pipoca & Nanquim
    termos: [battle royale]
    volumes: "1,3,4"
    formato: Omnibus
    buscas: [battle royale omnibus]

  - id: invencivel
    nome: Invencível
    editora: Panini
    termos: [invencivel]
    volumes: "3+"
    formato: Encadernado
    buscas: [invencivel panini]

  - id: lote-mulher-maravilha
    nome: Lote A Saga da Mulher-Maravilha
    termos: [saga da mulher maravilha]
    qualquer: [kit, lote, pacote, combo, box]
