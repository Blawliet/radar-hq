    qualquer: [kit, lote, pacote, combo]
    excluir: [saga do lanterna]
    volumes: box
    formato: Encadernado
    buscas: [kit lanterna verde panini]

  # Séries em andamento: troque "a partir de" pelo PRÓXIMO volume que você
  # ainda não tem e mude ativo para true. Desativadas para não alertar
  # volumes que você já tem.
  - id: dandadan
    nome: Dandadan
    termos: [dandadan]
    volumes: "99+"
    ativo: false
    formato: Mangá
    buscas: [dandadan]

  - id: tmnt-idw
    nome: Tartarugas Ninja IDW
    editora: Pipoca & Nanquim
    termos: [tartarugas ninja]
    excluir: [omnibus]
    volumes: "99+"
    ativo: false
    formato: Encadernado
    buscas: [tartarugas ninja pipoca e nanquim]

  - id: hunter-x-hunter
    nome: Hunter x Hunter
    termos: [hunter x hunter]
    volumes: "99+"
    ativo: false
    formato: Mangá
    buscas: [hunter x hunter]

  - id: frieren
    nome: Frieren
    termos: [frieren]
    volumes: "99+"
    ativo: false
    formato: Mangá
    buscas: [frieren]

  - id: sakamoto-days
    nome: Sakamoto Days
    termos: [sakamoto days]
    volumes: "99+"
    ativo: false
    formato: Mangá
    buscas: [sakamoto days]

# ---------------------------------------------------------------------
# RADAR PERMANENTE DE OMNIBUS (Regra B para qualquer omnibus)
# ---------------------------------------------------------------------
radar_omnibus:
  ativo: true
  termos: [omnibus]
  buscas: [omnibus marvel, omnibus dc, omnibus mythos, omnibus pipoca e nanquim]
