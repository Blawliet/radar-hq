# =====================================================================
# CATÁLOGO GERAL DO RADAR HQ
# =====================================================================
# As listas de cada pessoa ficam em config/pessoas/<nome>.yaml.
# Aqui ficam só as configurações comuns e os radares permanentes,
# que cada pessoa liga ou desliga no próprio arquivo (campo "radares").
#
# Como cada entrada casa com um anúncio:
#   termos:        TODAS essas palavras precisam estar no título (sem acento, minúsculas)
#   qualquer:      pelo menos UMA dessas precisa estar no título
#   excluir:       NENHUMA dessas pode estar no título
#   regex / excluir_regex: para casos chatos (opcionais)
#   volumes:       "8,14" | "3-4" | "12+" | "todos" | "box" (item sem número de volume)
#   buscas:        o que digitar na busca de cada loja
#
# Precedência, por pessoa: bloqueios > raros > promoções > radares.
# Se um anúncio casa com uma série da pessoa mas o volume NÃO está na lista,
# ele é ignorado para ela (não cai nos radares).
# =====================================================================

config:
  desconto_minimo: 25        # % mínimo da Regra B
  margem_preco_lista: 1.05
  # títulos com estas palavras são edições estrangeiras (inglês, japonês...)
  excluir_titulos: [paperback, hardcover, english, english edition, by, edition, book one, book two,
                    book three, deluxe edition, tpb, comic book, kodansha, viz media,
                    yen press, shueisha, japanese, japones, ingles, espanol, edicion]   # preço "de" acima da capa x 1.05 é tratado como inflado


# ---------------------------------------------------------------------
# RADARES PERMANENTES (Regra B: qualquer item do tipo com >= desconto_minimo)
# Os bloqueios da Regra C continuam valendo, e séries do catálogo continuam
# respeitando a lista de volumes delas.
# ---------------------------------------------------------------------
radares:
  - id: radar-omnibus
    nome: Radar Omnibus
    termos: [omnibus]
    formato: Omnibus
    buscas: [omnibus marvel, omnibus dc, omnibus mythos, omnibus pipoca e nanquim]

  - id: radar-boxes
    nome: Sugestão de Box / Coleção
    qualquer: [box, boxset, kit, colecao completa, pacote, combo, lote, caixa]
    # pelo menos um sinal de que é quadrinho ou mangá
    qualquer_2: [manga, mangas, hq, hqs, quadrinho, quadrinhos, graphic novel, panini, jbc, newpop,
                 pipoca, nanquim, mythos, devir, conrad, darkside, marvel, dc, comics, shonen, seinen]
    excluir: [colorir, adesivo, adesivos, poster, camiseta, funko, action figure, chaveiro, marcador,
              caneca, luminaria, pelucia, card game, deck, booster, cartas, papelaria, caderno]
    formato: Box
    buscas: [box manga, box mangá panini, box manga jbc, box hq, kit hq panini, colecao completa manga]
