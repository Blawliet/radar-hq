# Sonda de lojas (manual): grava em data/sonda/ o que cada site responde ao GitHub.
name: Sonda de lojas

on:
  workflow_dispatch:
    inputs:
      alvos:
        description: "alvos separados por vírgula (vazio = todos)"
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Sondar
        run: python tools/sondar.py "${{ github.event.inputs.alvos }}"
      - name: Salvar resultado
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/sonda data/colecao data/nesta-chat.bin 2>/dev/null || git add data/sonda
          git diff --cached --quiet || git commit -m "sonda: $(date +'%d/%m %H:%M')"
          git pull --rebase -X theirs -q || true
          git push || echo "nada para enviar"
