name: Radar HQ

on:
  schedule:
    - cron: "30 8 * * *"    # 05h30 Brasília
    - cron: "0 12 * * *"    # 09h00
    - cron: "0 15 * * *"    # 12h00
    - cron: "0 18 * * *"    # 15h00
    - cron: "0 22 * * *"    # 19h00
    - cron: "30 2 * * *"    # 23h30
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = só manda mensagem de exemplo | seco = varre sem enviar | agora = varre e envia"
        type: choice
        options: [teste, seco, agora]
        default: teste

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
      CANAL: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      USE_PLAYWRIGHT: "true"
      DELAY_SEGUNDOS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache do navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Testes das regras
        run: python -m pytest -q

      - name: Rodar o radar
        run: python src/main.py --${{ github.event.inputs.modo || 'agora' }}

      - name: Salvar memória do radar
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "radar: estado $(date +'%d/%m %H:%M')"
          git push || echo "nada para enviar"
