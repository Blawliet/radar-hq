# Radar HQ rodando no GitHub Actions: sem PC ligado, sem servidor.
# Horários em UTC (Brasília = UTC-3). O GitHub pode atrasar alguns minutos.

name: Radar HQ

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). O agendador do GitHub costuma começar
    # ~40 min atrasado, então pedimos 40 min antes para cair perto do horário certo.
    - cron: "50 7-21/2 * * *"   # alvo 05h30, 07h30, 09h30, 11h30, 13h30, 15h30, 17h30, 19h30
    - cron: "50 23 * * *"       # alvo 21h30
    - cron: "50 1 * * *"        # alvo 23h30: varredura + resumão do dia
  # quando alguém muda a lista de uma pessoa, o bot manda as listas atualizadas no grupo
  push:
    paths: ["config/pessoas/**"]
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = exemplo | lista = o que cada um busca | relatorio = fácil ou difícil de achar | seco = varre sem enviar | agora = varre e envia"
        type: choice
        options: [teste, lista, relatorio, resumo, seco, agora]
        default: teste

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
      CANAL: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      USE_PLAYWRIGHT: "true"
      DELAY_SEGUNDOS: "3"
      MODO: ${{ github.event_name == 'push' && 'lista' || github.event.schedule == '50 1 * * *' && 'resumo' || github.event.inputs.modo || 'agora' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache do navegador
        if: env.MODO != 'teste' && env.MODO != 'lista'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        if: env.MODO != 'teste' && env.MODO != 'lista'
        run: python -m playwright install --with-deps chromium

      - name: Testes das regras
        run: python -m pytest -q

      - name: Rodar o radar
        timeout-minutes: 35
        run: python src/main.py --$MODO

      # Guarda no próprio repositório o que já foi alertado e os preços de capa,
      # para não repetir alerta na próxima janela.
      - name: Salvar memória do radar
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "radar: estado $(date +'%d/%m %H:%M')"
          git pull --rebase -X theirs -q || { git rebase --abort; git pull --no-rebase -X ours -q --no-edit; }
          git push || echo "nada para enviar"
